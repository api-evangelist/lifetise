actions:
  apisYmlCreated: true
  apisListed: 0
  apisListedReason: |
    No Coadjute API has a public documentation page or a documented base URL. The
    "Partner Cloud API" is named only in a legal policy, and the developer portal that
    once catalogued the APIs is returning 502. Listing an API entry would require
    inventing a humanURL or a baseURL, so apis[] is deliberately empty.
