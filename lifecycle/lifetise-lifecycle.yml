sla:
  url: https://www.coadjute.com/incident-severity-levels-and-slas
  uptime_target: null
  note: Coadjute publishes severity levels and response/recovery targets but no
    availability percentage. A Service Level Agreement is referenced as a contractual
    schedule in the Partner Terms of Service.
  severity_levels:
  - id: S1
    label: Critical
    definition: Emergency situations where partners lose complete access to the Coadjute
      Network through either API or Web Application
    response_time: Within 30 minutes
    recovery_target: Rapid restoration, aiming for a few hours
  - id: S2
    label: Significant
    definition: Major performance issues or functional unavailability within the API or
      Web Application, requiring manual workarounds
    response_time: Within 2 business hours
    recovery_target: Goal to resolve within one business day
  - id: S3
    label: Moderate
    definition: Partial service impairment, where key functionalities via API or Web
      Application are still operational, but some aspects are affected
    response_time: Within 12 business hours
    recovery_target: Resolution expected within several business days
  - id: S4
    label: Minor
    definition: Minor issues in the API or Web Application, such as interface glitches or
      minor bugs
    response_time: Within 2 business days
    recovery_target: Longer-term resolution
