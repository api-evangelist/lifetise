generated: '2026-07-26'
method: searched
source: live probes of every Coadjute host reachable from outside the partner gate
note: |
  Coadjute serves no /.well-known/ discovery surface on its marketing host
  (www.coadjute.com) and its API gateway (api.coadjute.com) authenticates even the
  discovery paths, answering 401 "Access Denied" to every /.well-known/ request. The
  only anonymous machine-readable discovery Coadjute publishes lives on its Auth0
  identity tenant at auth.coadjute.com, which serves both an OpenID Connect discovery
  document (OIDC Discovery 1.0) and an OAuth 2.0 Authorization Server Metadata
  document (RFC 8414). No security.txt (RFC 9116) is published on any host.
hosts:
