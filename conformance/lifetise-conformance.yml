note: |
  Every "conforms: true" below is evidenced from a document that could actually be
  fetched — overwhelmingly the Auth0 identity tenant, which is the only anonymous
  machine-readable surface Coadjute serves. The Partner Cloud API itself is fully gated,
  so no statement can be made about its payload, error or pagination conventions; those
  rows are recorded as unknown rather than false.
